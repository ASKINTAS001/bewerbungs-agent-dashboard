<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bewerbungs-Agent · Login</title>
<!-- v1.0 (23.08.2026): Login ueber echte Supabase Auth (signInWithPassword),
     nicht das custom Session-Token-Verfahren des Content-Agent-Cockpits.
     Grund: RLS auf v_suchvorschlaege/v_versandstand ist auf die Rolle
     'authenticated' zugeschnitten - die braucht ein echtes Supabase-JWT. -->

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2B2B2B">
<link rel="icon" href="icons/icon-192.png">

<style>
  :root{
    --anthrazit:#2B2B2B; --anthrazit-dark:#1E1E1E;
    --rot:#E2231A; --bg:#F4F2EF; --card:#FFFFFF;
    --text:#2B2B2B; --text-muted:#8A8A88; --line:#E4E1DC;
    --gruen:#1E7F4F; --gelb:#C98A00;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
    background:var(--bg); color:var(--text); font-size:14px; line-height:1.5;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding:16px;
  }
  .box{
    background:var(--card); border:1px solid var(--line); border-radius:14px;
    border-top:3px solid var(--rot);
    padding:28px 26px; width:100%; max-width:360px;
  }
  .brand{display:flex; align-items:center; gap:10px; margin-bottom:22px;}
  .brand img{width:34px; height:34px;}
  .brand span{font-weight:700; font-size:15px;}
  h1{font-size:13px; font-weight:700; text-transform:uppercase; letter-spacing:.06em;
     color:var(--text-muted); margin-bottom:18px;}
  label{display:block; font-size:12.5px; font-weight:600; margin-bottom:6px; margin-top:14px;}
  input{
    width:100%; padding:10px 12px; border:1px solid var(--line); border-radius:8px;
    font-size:14px; font-family:inherit; background:#fafafa;
  }
  input:focus{outline:none; border-color:var(--rot); background:#fff;}
  button{
    width:100%; margin-top:20px; padding:11px; border-radius:8px; border:none;
    background:var(--rot); color:#fff; font-size:14px; font-weight:600; cursor:pointer;
  }
  button:disabled{opacity:.5; cursor:default;}
  .err{
    margin-top:14px; padding:10px 12px; border-radius:8px; font-size:12.5px;
    background:#FDECEC; border:1px solid #F3C9C6; color:#8A1F1B; display:none;
  }
  .foot{margin-top:18px; font-size:11px; color:var(--text-muted); text-align:center;}
</style>
</head>
<body>

<div class="box">
  <div class="brand">
    <img src="icons/icon-192.png" alt="" onerror="this.style.display='none'">
    <span>Bewerbungs-Agent</span>
  </div>
  <h1>Anmelden</h1>

  <form id="loginForm">
    <label for="email">E-Mail</label>
    <input type="email" id="email" autocomplete="username" required>

    <label for="pw">Passwort</label>
    <input type="password" id="pw" autocomplete="current-password" required>

    <button type="submit" id="loginBtn">Anmelden</button>
    <div class="err" id="err"></div>
  </form>

  <div class="foot">INNOVIA-TAS &middot; Askin Tas</div>
</div>

<script type="module">
  import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm';

  // ==== Konfiguration ====
  // ANON KEY (nicht service_role!) findest du in Supabase unter
  // Project Settings -> API -> Project API keys -> anon / public.
  const SUPABASE_URL = 'https://phqhzyiocxtkkqyddiaj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InBocWh6eWlvY3h0a2txeWRkaWFqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUyOTUyOTMsImV4cCI6MjEwMDg3MTI5M30.ArVUzuJzQeX3A4X36FzDL5Cu5JkOhWD3zylUg177f7Q';

  const supabase = createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // Bereits angemeldet? Dann direkt weiter.
  const { data: { session } } = await supabase.auth.getSession();
  if (session) location.href = 'dashboard.html';

  const form = document.getElementById('loginForm');
  const btn  = document.getElementById('loginBtn');
  const err  = document.getElementById('err');

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Prüfe …';

    const email = document.getElementById('email').value.trim();
    const pw    = document.getElementById('pw').value;

    const { error } = await supabase.auth.signInWithPassword({ email, password: pw });

    if (error) {
      err.textContent = error.message === 'Invalid login credentials'
        ? 'E-Mail oder Passwort falsch.'
        : 'Anmeldung fehlgeschlagen: ' + error.message;
      err.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Anmelden';
      return;
    }

    location.href = 'dashboard.html';
  });
</script>

</body>
</html>
